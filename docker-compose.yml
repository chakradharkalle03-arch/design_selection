version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/embroidery.db
      - STORAGE_DIR=/app/storage
      - MODEL_NAME=openai/clip-vit-base-patch32
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./storage:/app/storage
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
